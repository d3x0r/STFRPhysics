  </svg><div id="vis-container"><h2 class="sr-only">Sawtooth radius profiles for isotropic storage and the square-root map, plus a ruler strip showing the map's cell boundaries bunching toward the surface.</h2>
<div style="display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin:0 0 10px;font-size:13px;color:var(--text-secondary)">
  <label style="display:flex;align-items:center;gap:8px">surface Σ (exaggerated) <input type="range" id="sig" min="0.02" max="0.45" step="0.01" value="0.2" style="width:140px"><span id="sigv" style="min-width:34px;color:var(--text-primary)">0.20</span></label>

</div>
<svg width="100%" viewBox="0 0 680 420" role="img"><title>Sawtooth radius profiles with a ruler strip</title><desc>Top: isotropic storage teeth. Middle: flat cell boundaries joined to their mapped positions, bunching near the surface. Bottom: the map's teeth drawn at their mapped positions.</desc><g id="g"></g></svg>
<div id="out" style="font-size:13px;color:var(--text-secondary);margin-top:6px;line-height:1.6"></div>
<script>
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function txt(g,x,y,s,anchor){const t=el('text',{x,y,class:'ts','text-anchor':anchor||'start'});t.textContent=s;g.appendChild(t);}
function draw(){
  const S=+$('sig').value,N=+$('nseg').value,mode=$('mode').value;
  $('sigv').textContent=S.toFixed(2);$('nv').textContent=N;
  const g=$('g');g.innerHTML='';
  const r0=1,r1=9,x0=50,sc=(640-x0)/(r1-r0+0.7),X=r=>x0+(r-r0)*sc;
  const rs=2*S,dOf=r=>mode==='fixed'?rs*r0:rs*r,rp=r=>Math.sqrt(r*r+dOf(r));
  const dR=(r1-r0)/N;let ex1=0,ex2=0;
  const yT=120,yM=225,yB=360,teal='#1D9E75',coral='#D85A30';
  g.appendChild(el('line',{x1:x0-6,y1:yT,x2:645,y2:yT,stroke:'var(--text-muted)','stroke-width':0.5}));
  txt(g,x0,yT-80,'isotropic storage: diagonal = ψ·dR on the flat spacing');
  for(let i=0;i<N;i++){const a=r0+i*dR,b=a+dR,s=S/(a+dR/2),psi=Math.sqrt(1+2*s),h=dR*Math.sqrt(psi*psi-1)*sc;ex1+=(psi-1)*dR;
    g.appendChild(el('line',{x1:X(a),y1:yT,x2:X(b),y2:yT-h,stroke:teal,'stroke-width':1.6,'stroke-linecap':'round'}));
    g.appendChild(el('line',{x1:X(b),y1:yT-h,x2:X(b),y2:yT,stroke:teal,'stroke-width':0.6,'stroke-dasharray':'2 2'}));
    g.appendChild(el('circle',{cx:X(a),cy:yT,r:1.6,fill:'var(--text-secondary)'}));}
  txt(g,x0,yM-34,'cell boundaries: flat r (grey, top) joined to mapped r′ (coral, bottom)');
  g.appendChild(el('line',{x1:x0-6,y1:yM-12,x2:645,y2:yM-12,stroke:'var(--text-muted)','stroke-width':0.5}));
  g.appendChild(el('line',{x1:x0-6,y1:yM+12,x2:645,y2:yM+12,stroke:'var(--text-muted)','stroke-width':0.5}));
  for(let i=0;i<=N;i++){const a=r0+i*dR,m=rp(a);
    g.appendChild(el('line',{x1:X(a),y1:yM-18,x2:X(a),y2:yM-6,stroke:'var(--text-secondary)','stroke-width':1}));
    if(X(m)<=648){g.appendChild(el('line',{x1:X(a),y1:yM-6,x2:X(m),y2:yM+6,stroke:coral,'stroke-width':0.5,opacity:0.6}));
    g.appendChild(el('line',{x1:X(m),y1:yM+6,x2:X(m),y2:yM+18,stroke:coral,'stroke-width':1.2}));}}
  g.appendChild(el('line',{x1:x0-6,y1:yB,x2:645,y2:yB,stroke:'var(--text-muted)','stroke-width':0.5}));
  txt(g,x0,yB-80,mode==='fixed'?'√(r²+d²) map, fixed d: diagonal = one cell, base = mapped spacing':'√(r²+d²) map, d² = r_s·r: diagonal = one cell, base = mapped spacing');
  for(let i=0;i<N;i++){const a=r0+i*dR,b=a+dR,pa=rp(a),pb=rp(b),base=pb-pa,h=Math.sqrt(Math.max(dR*dR-base*base,0))*sc;ex2+=dR-base;
    if(X(pb)>648)break;
    g.appendChild(el('line',{x1:X(pa),y1:yB,x2:X(pb),y2:yB-h,stroke:coral,'stroke-width':1.6,'stroke-linecap':'round'}));
    g.appendChild(el('line',{x1:X(pb),y1:yB-h,x2:X(pb),y2:yB,stroke:coral,'stroke-width':0.6,'stroke-dasharray':'2 2'}));
    g.appendChild(el('circle',{cx:X(pa),cy:yB,r:1.6,fill:coral}));}
  [1,3,5,7,9].forEach(r=>txt(g,X(r),yB+18,'r = '+r,'middle'));

}
